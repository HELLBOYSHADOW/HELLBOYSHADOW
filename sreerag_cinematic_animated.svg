<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="700"
     height="394"
     viewBox="0 0 700 394"
     preserveAspectRatio="xMidYMid slice">

  <defs>
    <linearGradient id="cinematic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity=".28"/>
      <stop offset="45%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E9D5FF" stop-opacity=".8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <clipPath id="frame">
      <rect width="700" height="394" rx="4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Original animated GIF -->
    <image
      x="0" y="0" width="700" height="394"
      preserveAspectRatio="xMidYMid slice"
      href="https://raw.githubusercontent.com/HELLBOYSHADOW/HELLBOYSHADOW/main/b0xwmg.gif"
      xlink:href="https://raw.githubusercontent.com/HELLBOYSHADOW/HELLBOYSHADOW/main/b0xwmg.gif"/>

    <!-- Cinematic overlay -->
    <rect width="700" height="394" fill="url(#cinematic)"/>

    <!-- Moving futuristic scan -->
    <rect x="-220" y="0" width="220" height="394"
          fill="url(#scan)" opacity=".22" filter="url(#glow)">
      <animate attributeName="x"
               from="-220" to="700"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Thin scan beam -->
    <rect x="-160" y="0" width="160" height="2" fill="#E9D5FF">
      <animate attributeName="x"
               from="-160" to="700"
               dur="4s"
               repeatCount="indefinite"/>
    </rect>

    <!-- Subtle vignette -->
    <rect x="0" y="0" width="700" height="394"
          fill="none" stroke="#A855F7" stroke-opacity=".35"
          stroke-width="2"/>
  </g>
</svg>
