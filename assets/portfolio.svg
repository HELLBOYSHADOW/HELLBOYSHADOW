<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 370"
     width="1200"
     height="370"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Developer Portfolio — Web Project</title>
  <desc id="desc">
    Matrix-themed project banner for Sreerag's personal developer portfolio website.
  </desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020805"/>
      <stop offset=".55" stop-color="#000A04"/>
      <stop offset="1" stop-color="#001507"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#C8FFD5"/>
      <stop offset="1" stop-color="#00FF41"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="78%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00FF41" stop-opacity=".13"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24"
            fill="none"
            stroke="#00FF41"
            stroke-opacity=".08"
            stroke-width=".6"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="370" rx="10"/>
    </clipPath>

    <g id="codeColumn"
       font-family="Courier New, monospace"
       font-size="12"
       font-weight="bold"
       fill="#00FF41">
      <text y="0">1</text>
      <text y="15">0</text>
      <text y="30">1</text>
      <text y="45">1</text>
      <text y="60">0</text>
      <text y="75">0</text>
      <text y="90">1</text>
      <text y="105">0</text>
      <text y="120">1</text>
      <text y="135">0</text>
      <text y="150">1</text>
      <text y="165">0</text>
      <text y="180">1</text>
      <text y="195">1</text>
      <text y="210">0</text>
      <text y="225">1</text>
    </g>

    <linearGradient id="borderTrace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#00FF41"/>
      <stop offset=".7" stop-color="#00FF41" stop-opacity=".4"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: "Courier New", Consolas, monospace;
    }

    .sans {
      font-family: Arial, Helvetica, sans-serif;
    }

    .green {
      fill: #00FF41;
    }

    .text {
      fill: #D8FFE0;
    }

    .muted {
      fill: #83B991;
    }

    .panel {
      fill: #001607;
      fill-opacity: .88;
      stroke: #00FF41;
      stroke-opacity: .45;
    }

    .intro {
      animation: intro 1s ease-out both;
    }

    .delay {
      animation-delay: .3s;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .trace {
      stroke-dasharray: 170 3380;
      stroke-dashoffset: 3550;
      animation: trace 8s linear infinite;
    }

    .cursor {
      animation: pulse 1s steps(2,start) infinite;
    }

    @keyframes intro {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: .4; }
      50% { opacity: 1; }
    }

    @keyframes trace {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro, .pulse, .trace, .cursor {
        animation: none !important;
      }
    }
  </style>

  <g clip-path="url(#clip)">

    <!-- BACKGROUND -->

    <rect width="1200" height="370" fill="url(#bg)"/>
    <rect width="1200" height="370" fill="url(#grid)"/>
    <rect width="1200" height="370" fill="url(#ambientGlow)"/>

    <!-- MATRIX DIGITAL RAIN -->

    <g opacity=".24">
      <use href="#codeColumn" x="35" y="-80">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 -100;0 260"
                          dur="10s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="125" y="-150">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 -100;0 280"
                          dur="12s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="580" y="-120">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 -100;0 260"
                          dur="11s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="760" y="-180">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 -100;0 280"
                          dur="9s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="1150" y="-100">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 -100;0 260"
                          dur="12s"
                          repeatCount="indefinite"/>
      </use>
    </g>

    <!-- PROJECT HEADER -->

    <g class="intro">
      <text class="mono green"
            x="42" y="35"
            font-size="10"
            letter-spacing="1.3">
        [ PROJECT_03 // WEB_DEVELOPMENT ]
      </text>

      <circle cx="1120" cy="30" r="3"
              fill="#00FF41"
              filter="url(#glow)"
              class="pulse"/>

      <text class="mono muted"
            x="1133" y="34"
            font-size="9"
            text-anchor="start">
        DEPLOYED
      </text>
    </g>

    <!-- LEFT: PROJECT INFORMATION -->

    <g class="intro">

      <text class="mono green"
            x="42" y="76"
            font-size="11"
            letter-spacing="1.5">
        PERSONAL WEB PROJECT
      </text>

      <text class="sans"
            x="38" y="126"
            font-size="43"
            font-weight="800"
            letter-spacing=".2"
            fill="url(#titleGradient)">
        Developer Portfolio
      </text>

      <text class="mono green"
            x="42" y="153"
            font-size="12">
        DESIGN // DEVELOPMENT // DEPLOYMENT
      </text>

      <text class="sans text"
            x="42" y="184"
            font-size="13">
        A personal website showcasing software projects,
      </text>

      <text class="sans text"
            x="42" y="204"
            font-size="13">
        technical skills, and applied AI development.
      </text>

      <!-- TERMINAL -->

      <text class="mono muted"
            x="42" y="239"
            font-size="11.5">
        <tspan class="green">sreerag@portfolio:~$ </tspan>npm run build
      </text>

      <text class="mono text"
            x="42" y="260"
            font-size="11.5">
        &gt; Compiling portfolio application...
      </text>

      <text class="mono green"
            x="42" y="281"
            font-size="11.5">
        &gt; BUILD COMPLETED SUCCESSFULLY
      </text>

      <rect x="42" y="292"
            width="7" height="12"
            fill="#00FF41"
            class="cursor"/>

      <!-- TECHNOLOGY TAGS -->

      <g transform="translate(42 315)">
        <rect width="76" height="24" rx="3" class="panel"/>
        <text class="mono text"
              x="38" y="16"
              font-size="10"
              text-anchor="middle">Next.js</text>
      </g>

      <g transform="translate(127 315)">
        <rect width="83" height="24" rx="3" class="panel"/>
        <text class="mono text"
              x="41.5" y="16"
              font-size="10"
              text-anchor="middle">React</text>
      </g>

      <g transform="translate(219 315)">
        <rect width="87" height="24" rx="3" class="panel"/>
        <text class="mono text"
              x="43.5" y="16"
              font-size="10"
              text-anchor="middle">JavaScript</text>
      </g>

      <g transform="translate(315 315)">
        <rect width="80" height="24" rx="3" class="panel"/>
        <text class="mono text"
              x="40" y="16"
              font-size="10"
              text-anchor="middle">Applied AI</text>
      </g>

    </g>

    <!-- RIGHT: WEBSITE TERMINAL -->

    <g class="intro delay">

      <rect x="650" y="53"
            width="510" height="286"
            rx="5"
            fill="#000A04"
            fill-opacity=".96"
            stroke="#00FF41"
            stroke-opacity=".65"/>

      <!-- TERMINAL HEADER -->

      <rect x="651" y="54"
            width="508" height="30"
            fill="#00FF41"
            fill-opacity=".08"/>

      <circle cx="669" cy="69" r="3" fill="#00FF41"/>
      <circle cx="680" cy="69" r="3" fill="#00FF41" opacity=".6"/>
      <circle cx="691" cy="69" r="3" fill="#00FF41" opacity=".3"/>

      <text class="mono text"
            x="708" y="73"
            font-size="10.5">
        PORTFOLIO_WEB.exe
      </text>

      <text class="mono green"
            x="1144" y="73"
            font-size="9"
            text-anchor="end">
        RUNNING
      </text>

      <!-- WEBSITE MODULES -->

      <text class="mono green"
            x="675" y="108"
            font-size="10.5"
            letter-spacing=".8">
        [ WEBSITE MODULES ]
      </text>

      <line x1="675" y1="117"
            x2="1137" y2="117"
            stroke="#00FF41"
            stroke-opacity=".3"/>

      <!-- MODULE 1 -->

      <g transform="translate(675 132)">
        <rect width="220" height="53"
              rx="3" class="panel"/>

        <text class="mono green"
              x="13" y="18"
              font-size="10">
          01 // ABOUT
        </text>

        <text class="mono text"
              x="13" y="37"
              font-size="10.5">
          Developer introduction
        </text>
      </g>

      <!-- MODULE 2 -->

      <g transform="translate(910 132)">
        <rect width="227" height="53"
              rx="3" class="panel"/>

        <text class="mono green"
              x="13" y="18"
              font-size="10">
          02 // PROJECTS
        </text>

        <text class="mono text"
              x="13" y="37"
              font-size="10.5">
          Selected applications
        </text>
      </g>

      <!-- MODULE 3 -->

      <g transform="translate(675 198)">
        <rect width="220" height="53"
              rx="3" class="panel"/>

        <text class="mono green"
              x="13" y="18"
              font-size="10">
          03 // TECH STACK
        </text>

        <text class="mono text"
              x="13" y="37"
              font-size="10.5">
          Skills and technologies
        </text>
      </g>

      <!-- MODULE 4 -->

      <g transform="translate(910 198)">
        <rect width="227" height="53"
              rx="3" class="panel"/>

        <text class="mono green"
              x="13" y="18"
              font-size="10">
          04 // CONTACT
        </text>

        <text class="mono text"
              x="13" y="37"
              font-size="10.5">
          Connect with developer
        </text>
      </g>

      <!-- DEPLOYMENT STATUS -->

      <rect x="675" y="266"
            width="462" height="52"
            rx="3"
            fill="#001207"
            stroke="#00FF41"
            stroke-opacity=".4"/>

      <circle cx="692" cy="284" r="3"
              fill="#00FF41"
              class="pulse"/>

      <text class="mono green"
            x="704" y="288"
            font-size="10">
        DEPLOYMENT_STATUS
      </text>

      <text class="mono text"
            x="704" y="306"
            font-size="10.5">
        https://lestofc.vercel.app/
      </text>

      <text class="mono muted"
            x="1130" y="306"
            font-size="9"
            text-anchor="end">
        VERCEL
      </text>

    </g>

    <!-- OUTER FRAME -->

    <rect x=".5" y=".5"
          width="1199" height="369"
          rx="9.5"
          fill="none"
          stroke="#00FF41"
          stroke-opacity=".5"/>

    <rect class="trace"
          x=".5" y=".5"
          width="1199" height="369"
          rx="9.5"
          fill="none"
          stroke="url(#borderTrace)"
          stroke-width="1.5"
          stroke-linecap="round"
          filter="url(#glow)"/>

    <!-- CORNER ACCENTS -->

    <path d="M1 27V1H27
             M1173 1H1199V27
             M1 343V369H27
             M1173 369H1199V343"
          fill="none"
          stroke="#00FF41"
          stroke-width="1.5"/>

  </g>
</svg>