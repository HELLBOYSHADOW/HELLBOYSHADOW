<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 370"
     width="1200"
     height="370"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Advanced WhatsApp AI Bot — Matrix Edition</title>
  <desc id="desc">A Matrix-inspired green terminal banner for an AI-powered WhatsApp bot project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020805"/>
      <stop offset=".55" stop-color="#000A04"/>
      <stop offset="1" stop-color="#001507"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF41"/>
      <stop offset=".5" stop-color="#D7FFE0"/>
      <stop offset="1" stop-color="#00FF41"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#C8FFD5"/>
      <stop offset="1" stop-color="#00FF41"/>
    </linearGradient>

    <radialGradient id="glow" cx="78%" cy="45%" r="60%">
      <stop offset="0" stop-color="#00FF41" stop-opacity=".15"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="24" height="24"
             patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24"
            fill="none"
            stroke="#00FF41"
            stroke-opacity=".09"
            stroke-width=".6"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="clip">
      <rect width="1200" height="370" rx="12"/>
    </clipPath>

    <g id="codeColumn"
       font-family="Courier New, monospace"
       font-size="12"
       font-weight="bold"
       fill="#00FF41">
      <text x="0" y="0">1</text>
      <text x="0" y="15">0</text>
      <text x="0" y="30">1</text>
      <text x="0" y="45">1</text>
      <text x="0" y="60">0</text>
      <text x="0" y="75">0</text>
      <text x="0" y="90">1</text>
      <text x="0" y="105">0</text>
      <text x="0" y="120">1</text>
      <text x="0" y="135">0</text>
      <text x="0" y="150">1</text>
      <text x="0" y="165">0</text>
      <text x="0" y="180">1</text>
      <text x="0" y="195">1</text>
      <text x="0" y="210">0</text>
      <text x="0" y="225">1</text>
      <text x="0" y="240">0</text>
      <text x="0" y="255">1</text>
      <text x="0" y="270">0</text>
      <text x="0" y="285">1</text>
    </g>

    <linearGradient id="borderTrace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".3" stop-color="#00FF41"/>
      <stop offset=".7" stop-color="#00FF41" stop-opacity=".5"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: "Courier New", Consolas, monospace;
      font-style: normal;
    }

    .sans {
      font-family: Arial, Helvetica, sans-serif;
      font-style: normal;
    }

    .text {
      fill: #D8FFE0;
    }

    .muted {
      fill: #83B991;
    }

    .green {
      fill: #00FF41;
    }

    .panel {
      fill: #001607;
      fill-opacity: .9;
      stroke: #00FF41;
      stroke-opacity: .55;
    }

    .intro {
      animation: intro 1s ease-out both;
    }

    .delay {
      animation-delay: .3s;
    }

    .chip {
      animation: intro .7s ease-out both;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
    }

    .scan {
      animation: scan 6s linear infinite;
    }

    .rain {
      animation: rain 8s linear infinite;
    }

    .trace {
      stroke-dasharray: 170 3380;
      stroke-dashoffset: 3550;
      animation: trace 8s linear infinite;
    }

    .draw {
      stroke-dasharray: 620;
      stroke-dashoffset: 620;
      animation: draw 1.8s ease-out .4s forwards;
    }

    @keyframes intro {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }

    @keyframes scan {
      from { transform: translateY(-390px); }
      to { transform: translateY(390px); }
    }

    @keyframes rain {
      from { transform: translateY(-100px); }
      to { transform: translateY(200px); }
    }

    @keyframes trace {
      to { stroke-dashoffset: 0; }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .intro, .chip, .pulse, .scan, .rain, .trace, .draw {
        animation: none !important;
      }
      .draw { stroke-dashoffset: 0; }
      .trace { display: none; }
    }
  </style>

  <g clip-path="url(#clip)">

    <!-- MATRIX BACKGROUND -->
    <rect width="1200" height="370" fill="url(#bg)"/>
    <rect width="1200" height="370" fill="url(#grid)"/>
    <rect width="1200" height="370" fill="url(#glow)"/>

    <!-- DIGITAL RAIN -->
    <g opacity=".45">
      <use href="#codeColumn" x="28" y="-150">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 260"
                          dur="7s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="92" y="-300">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 280"
                          dur="9s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="180" y="-220">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 250"
                          dur="8s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="270" y="-350">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 300"
                          dur="10s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="660" y="-250">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 270"
                          dur="8s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="730" y="-320">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 300"
                          dur="9s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="820" y="-190">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 240"
                          dur="7s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="930" y="-350">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 290"
                          dur="10s"
                          repeatCount="indefinite"/>
      </use>

      <use href="#codeColumn" x="1100" y="-250">
        <animateTransform attributeName="transform"
                          type="translate"
                          values="0 0;0 270"
                          dur="8s"
                          repeatCount="indefinite"/>
      </use>
    </g>

    <!-- SCANLINES -->
    <g opacity=".1" stroke="#00FF41" stroke-width=".5">
      <path d="M0 20H1200 M0 42H1200 M0 64H1200
               M0 86H1200 M0 108H1200 M0 130H1200
               M0 152H1200 M0 174H1200 M0 196H1200
               M0 218H1200 M0 240H1200 M0 262H1200
               M0 284H1200 M0 306H1200 M0 328H1200
               M0 350H1200"/>
    </g>

    <!-- LEFT: PROJECT IDENTITY -->
    <g class="intro">

      <text class="mono green"
            x="45" y="40"
            font-size="11"
            letter-spacing="1.5">
        [ PROJECT_02 // WHATSAPP_AI // ONLINE ]
      </text>

      <circle cx="665" cy="35" r="3"
              fill="#00FF41"
              filter="url(#glow)"
              class="pulse"/>

      <!-- TITLE -->
      <text class="sans"
            x="41" y="101"
            font-size="43"
            font-weight="800"
            letter-spacing=".5"
            fill="#00FF41"
            opacity=".25"
            filter="url(#softGlow)">
        WhatsApp AI Bot
      </text>

      <text class="sans"
            x="41" y="101"
            font-size="43"
            font-weight="800"
            letter-spacing=".5"
            fill="url(#titleGradient)"
            filter="url(#glow)">
        WhatsApp AI Bot
      </text>

      <text class="mono green"
            x="45" y="130"
            font-size="12">
        INTELLIGENT MESSAGING // AUTOMATION
      </text>

      <text class="mono text"
            x="45" y="158"
            font-size="12.5">
        An AI-powered assistant for smarter conversations.
      </text>

      <text class="mono muted"
            x="45" y="180"
            font-size="11.5">
        AUTOMATE // UNDERSTAND // RESPOND
      </text>

      <!-- TERMINAL COMMAND -->
      <text class="mono muted"
            x="45" y="207"
            font-size="11.5">
        <tspan class="green">sreerag@whatsapp-ai:~$ </tspan>
        initialize_bot.exe
      </text>

      <line class="draw"
            x1="45" y1="222"
            x2="660" y2="222"
            stroke="#00FF41"
            stroke-opacity=".8"/>

      <!-- FEATURE METRICS -->
      <g transform="translate(45 251)">
        <text class="mono green"
              font-size="23"
              font-weight="bold">AI</text>
        <text class="mono muted"
              y="20"
              font-size="9.5">SMART RESPONSES</text>
      </g>

      <line x1="238" y1="237" x2="238" y2="278"
            stroke="#00FF41" stroke-opacity=".4"/>

      <g transform="translate(258 251)">
        <text class="mono green"
              font-size="23"
              font-weight="bold">BOT</text>
        <text class="mono muted"
              y="20"
              font-size="9.5">AUTOMATION</text>
      </g>

      <line x1="433" y1="237" x2="433" y2="278"
            stroke="#00FF41" stroke-opacity=".4"/>

      <g transform="translate(454 251)">
        <text class="mono green"
              font-size="23"
              font-weight="bold">API</text>
        <text class="mono muted"
              y="20"
              font-size="9.5">INTEGRATION</text>
      </g>

      <!-- TECHNOLOGY CHIPS -->
      <g class="chip" style="animation-delay:.5s">
        <rect x="45" y="298" width="89" height="24"
              rx="3" class="panel"/>
        <text class="mono text"
              x="89.5" y="314"
              font-size="10"
              text-anchor="middle">JavaScript</text>
      </g>

      <g class="chip" style="animation-delay:.65s">
        <rect x="142" y="298" width="79" height="24"
              rx="3" class="panel"/>
        <text class="mono text"
              x="181.5" y="314"
              font-size="10"
              text-anchor="middle">Node.js</text>
      </g>

      <g class="chip" style="animation-delay:.8s">
        <rect x="229" y="298" width="86" height="24"
              rx="3" class="panel"/>
        <text class="mono text"
              x="272" y="314"
              font-size="10"
              text-anchor="middle">AI / LLMs</text>
      </g>

      <g class="chip" style="animation-delay:.95s">
        <rect x="323" y="298" width="87" height="24"
              rx="3" class="panel"/>
        <text class="mono text"
              x="366.5" y="314"
              font-size="10"
              text-anchor="middle">REST API</text>
      </g>

      <text class="mono green"
            x="45" y="349"
            font-size="10"
            letter-spacing="1">
        &gt; BOT SYSTEM READY
      </text>

      <text class="mono muted"
            x="660" y="349"
            font-size="9.5"
            text-anchor="end">
        BUILT BY SREERAG R
      </text>
    </g>

    <!-- RIGHT: AI BOT TERMINAL -->
    <g class="intro delay">

      <rect x="700" y="23"
            width="460" height="324"
            rx="5"
            fill="#000A04"
            fill-opacity=".94"
            stroke="#00FF41"
            stroke-opacity=".7"/>

      <!-- CORNER ACCENTS -->
      <path d="M700 47V23H724
               M1136 23H1160V47
               M700 323V347H724
               M1136 347H1160V323"
            fill="none"
            stroke="#00FF41"
            stroke-width="2"/>

      <!-- TERMINAL HEADER -->
      <rect x="701" y="24"
            width="458" height="29"
            fill="#00FF41"
            fill-opacity=".08"/>

      <circle cx="718" cy="38" r="3" fill="#00FF41"/>
      <circle cx="729" cy="38" r="3" fill="#00FF41" opacity=".6"/>
      <circle cx="740" cy="38" r="3" fill="#00FF41" opacity=".3"/>

      <text class="mono"
            x="755" y="42"
            font-size="10.5"
            fill="#D7FFE0">
        WHATSAPP_AI_CORE.exe
      </text>

      <text class="mono green"
            x="1145" y="42"
            font-size="9"
            text-anchor="end">
        LIVE
      </text>

      <!-- MESSAGE INPUT -->
      <rect x="719" y="66"
            width="422" height="46"
            rx="3"
            fill="#001A08"
            stroke="#00FF41"
            stroke-opacity=".65"/>

      <text class="mono green"
            x="733" y="82"
            font-size="9.5">
        &gt; INCOMING_MESSAGE
      </text>

      <text class="mono text"
            x="733" y="99"
            font-size="11.5">
        Hey bot, what can you do?
      </text>

      <!-- PROCESSING PIPELINE -->
      <text class="mono green"
            x="719" y="133"
            font-size="10"
            letter-spacing="1">
        [ AI MESSAGE PIPELINE ]
      </text>

      <g transform="translate(719 145)">
        <rect width="76" height="49" rx="3" class="panel"/>
        <text class="mono green" x="7" y="13" font-size="9">01</text>
        <text class="mono text" x="38" y="29" font-size="10"
              text-anchor="middle">RECEIVE</text>
        <text class="mono muted" x="38" y="41" font-size="8"
              text-anchor="middle">MESSAGE</text>
        <rect width="76" height="49" rx="3"
              fill="#00FF41" fill-opacity=".04">
          <animate attributeName="fill-opacity"
                   values=".02;.17;.02"
                   dur="5s"
                   repeatCount="indefinite"/>
        </rect>
      </g>

      <path d="M797 169H804L800 165M804 169L800 173"
            fill="none" stroke="#00FF41" stroke-width="1.3"/>

      <g transform="translate(807 145)">
        <rect width="76" height="49" rx="3" class="panel"/>
        <text class="mono green" x="7" y="13" font-size="9">02</text>
        <text class="mono text" x="38" y="29" font-size="10"
              text-anchor="middle">PROCESS</text>
        <text class="mono muted" x="38" y="41" font-size="8"
              text-anchor="middle">CONTEXT</text>
      </g>

      <path d="M885 169H892L888 165M892 169L888 173"
            fill="none" stroke="#00FF41" stroke-width="1.3"/>

      <g transform="translate(895 145)">
        <rect width="76" height="49" rx="3" class="panel"/>
        <text class="mono green" x="7" y="13" font-size="9">03</text>
        <text class="mono text" x="38" y="29" font-size="10"
              text-anchor="middle">AI THINK</text>
        <text class="mono muted" x="38" y="41" font-size="8"
              text-anchor="middle">GENERATE</text>
      </g>

      <path d="M973 169H980L976 165M980 169L976 173"
            fill="none" stroke="#00FF41" stroke-width="1.3"/>

      <g transform="translate(983 145)">
        <rect width="76" height="49" rx="3" class="panel"/>
        <text class="mono green" x="7" y="13" font-size="9">04</text>
        <text class="mono text" x="38" y="29" font-size="10"
              text-anchor="middle">RESPOND</text>
        <text class="mono muted" x="38" y="41" font-size="8"
              text-anchor="middle">MESSAGE</text>
      </g>

      <path d="M1061 169H1068L1064 165M1068 169L1064 173"
            fill="none" stroke="#00FF41" stroke-width="1.3"/>

      <g transform="translate(1071 145)">
        <rect width="70" height="49" rx="3" class="panel"/>
        <text class="mono green" x="7" y="13" font-size="9">05</text>
        <text class="mono text" x="35" y="29" font-size="9.5"
              text-anchor="middle">DELIVER</text>
        <text class="mono muted" x="35" y="41" font-size="8"
              text-anchor="middle">WHATSAPP</text>
      </g>

      <!-- RESPONSE TERMINAL -->
      <rect x="719" y="209"
            width="422" height="115"
            rx="3"
            fill="#000D04"
            stroke="#00FF41"
            stroke-opacity=".4"/>

      <text class="mono green"
            x="732" y="228"
            font-size="10.5">
        sreerag@bot:~$ response_status
      </text>

      <line x1="732" y1="237"
            x2="1128" y2="237"
            stroke="#00FF41"
            stroke-opacity=".3"/>

      <text class="mono green"
            x="733" y="254"
            font-size="10.5">[ OK ]</text>
      <text class="mono text"
            x="790" y="254"
            font-size="10.5">Message received</text>

      <text class="mono green"
            x="733" y="273"
            font-size="10.5">[ OK ]</text>
      <text class="mono text"
            x="790" y="273"
            font-size="10.5">AI response processed</text>

      <text class="mono green"
            x="733" y="292"
            font-size="10.5">[ OK ]</text>
      <text class="mono text"
            x="790" y="292"
            font-size="10.5">Reply prepared for delivery</text>

      <text class="mono green"
            x="733" y="313"
            font-size="10.5">
        &gt; AWAITING NEXT MESSAGE
      </text>

      <rect x="1124" y="305"
            width="5" height="10"
            fill="#00FF41"
            class="pulse"/>
    </g>

    <!-- MOVING SCAN BAR -->
    <g opacity=".1">
      <rect class="scan"
            x="0" y="0"
            width="1200" height="2"
            fill="#00FF41"/>
    </g>

    <!-- FRAME -->
    <rect x=".5" y=".5"
          width="1199" height="369"
          rx="11.5"
          fill="none"
          stroke="#00FF41"
          stroke-opacity=".55"/>

    <rect class="trace"
          x=".5" y=".5"
          width="1199" height="369"
          rx="11.5"
          fill="none"
          stroke="url(#borderTrace)"
          stroke-width="2"
          stroke-linecap="round"
          filter="url(#glow)"/>

    <path d="M1 25V1H25
             M1175 1H1199V25
             M1 345V369H25
             M1175 369H1199V345"
          fill="none"
          stroke="#00FF41"
          stroke-width="2"/>
  </g>
</svg>