<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 1050"
     width="1200"
     height="1050"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Services and Skills — Matrix Interface</title>
  <desc id="desc">Six Matrix-inspired service cards for AI development, WhatsApp automation, Lesto, gaming optimization, Learnify, and OSINT frame analysis.</desc>

  <defs>
    <!-- Matrix border gradient -->
    <linearGradient id="matrix-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FF41" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#008F11" stop-opacity=".65"/>
      <stop offset="1" stop-color="#00FF41" stop-opacity=".25"/>
    </linearGradient>

    <!-- Divider gradient -->
    <linearGradient id="matrix-divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00FF41" stop-opacity=".8"/>
      <stop offset=".72" stop-color="#008F11" stop-opacity=".5"/>
      <stop offset="1" stop-color="#008F11" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle grid -->
    <pattern id="micro-grid"
             width="18"
             height="18"
             patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18"
            fill="none"
            stroke="#00FF41"
            stroke-opacity=".045"
            stroke-width=".6"/>
    </pattern>

    <!-- Neon glow -->
    <filter id="green-glow"
            x="-40%"
            y="-40%"
            width="180%"
            height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: "Courier New", monospace;
      }

      .sans {
        font-family: Arial, Helvetica, sans-serif;
      }

      .green {
        fill: #00FF41;
      }

      .muted {
        fill: #78A887;
      }

      .card-title {
        fill: #F2FFF5;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -.45px;
      }

      .description {
        fill: #C8D4CB;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 13.2px;
      }

      .category {
        fill: #00FF41;
        font-family: "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
      }

      .number {
        fill: #00FF41;
        font-family: "Courier New", monospace;
        font-size: 29px;
        font-weight: 700;
      }

      .status {
        fill: #00FF41;
        font-family: "Courier New", monospace;
        font-size: 9px;
        letter-spacing: .6px;
      }

      .sys {
        fill: #63816B;
        font-family: "Courier New", monospace;
        font-size: 9px;
        letter-spacing: .8px;
      }

      .tag-text {
        fill: #D8E9DC;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: .15px;
      }

      .tag {
        fill: #061009;
        fill-opacity: .55;
        stroke: #176B32;
        stroke-opacity: .75;
        stroke-width: .8;
      }

      .card {
        fill: #030704;
        fill-opacity: .78;
        stroke: url(#matrix-border);
        stroke-width: 1;
      }
    </style>
  </defs>

  <!-- Main background -->
  <rect x="16"
        y="14"
        width="1168"
        height="1022"
        rx="13"
        fill="#020503"
        fill-opacity=".96"/>

  <rect x="16"
        y="14"
        width="1168"
        height="1022"
        rx="13"
        fill="url(#micro-grid)"/>

  <!-- Outer Matrix frame -->
  <path d="M29 14H1171
           L1184 27
           V1023
           L1171 1036
           H29
           L16 1023
           V27Z"
        fill="none"
        stroke="url(#matrix-border)"
        stroke-width="1.2"/>

  <path d="M29 14H1171
           L1184 27
           M16 1010V27L29 14
           M16 1010V1023L29 1036
           M1171 1036L1184 1023V1010"
        fill="none"
        stroke="#00FF41"
        stroke-opacity=".55"
        stroke-width="1.1"/>

  <!-- Header -->
  <rect x="47"
        y="35"
        width="7"
        height="7"
        fill="#00FF41"
        filter="url(#green-glow)"/>

  <text x="64"
        y="43"
        class="mono green"
        font-size="13"
        letter-spacing="2">
    MATRIX // SERVICES &amp; SKILLS
  </text>

  <text x="1150"
        y="42"
        class="mono muted"
        font-size="9"
        text-anchor="end">
    PROFILE.SYS / 06 MODULES
  </text>

  <path d="M47 56H1152"
        stroke="url(#matrix-divider)"
        stroke-width=".8"/>

  <!-- ====================================== -->
  <!-- 01 — AI & GENERATIVE AI                -->
  <!-- ====================================== -->

  <g>
    <rect class="card"
          x="47"
          y="70"
          width="1106"
          height="145"
          rx="9"/>

    <path d="M47 88V79L56 70
             M1144 70L1153 79V88"
          fill="none"
          stroke="#00FF41"
          stroke-opacity=".65"/>

    <text x="68" y="111" class="number">01</text>

    <path d="M68 123H85"
          stroke="#00FF41"
          stroke-width="1.2"/>

    <text x="116" y="91" class="category">
      AI &amp; GENERATIVE AI
    </text>

    <text x="116" y="116" class="card-title">
      AI &amp; GENERATIVE AI DEVELOPMENT
    </text>

    <text x="116" y="138" class="description">
      <tspan x="116">
        Building practical AI-powered applications using large language models, AI APIs, automation, and intelligent user
      </tspan>
      <tspan x="116" dy="17">
        experiences.
      </tspan>
    </text>

    <text x="1017"
          y="91"
          class="status"
          text-anchor="end">
      [ STATUS: ACTIVE ]
    </text>

    <text x="1130"
          y="91"
          class="sys"
          text-anchor="end">
      SYS // 01
    </text>

    <g transform="translate(116 174)">
      <rect class="tag" width="245" height="25" rx="5"/>
      <circle cx="12" cy="12.5" r="2.5" class="green"/>
      <text x="22" y="16" class="tag-text">
        LLM &amp; GENERATIVE AI APPLICATIONS
      </text>

      <rect class="tag" x="257" width="245" height="25" rx="5"/>
      <circle cx="269" cy="12.5" r="2.5" class="green"/>
      <text x="279" y="16" class="tag-text">
        GEMINI / GROQ / OPENROUTER APIS
      </text>

      <rect class="tag" x="514" width="245" height="25" rx="5"/>
      <circle cx="526" cy="12.5" r="2.5" class="green"/>
      <text x="536" y="16" class="tag-text">
        AI AUTOMATION &amp; ASSISTANTS
      </text>

      <rect class="tag" x="771" width="245" height="25" rx="5"/>
      <circle cx="783" cy="12.5" r="2.5" class="green"/>
      <text x="793" y="16" class="tag-text">
        PROMPT ENGINEERING &amp; AI INTEGRATION
      </text>
    </g>
  </g>

  <!-- ====================================== -->
  <!-- 02 — WHATSAPP AUTOMATION               -->
