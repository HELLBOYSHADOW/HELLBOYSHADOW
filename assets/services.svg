      </tspan>
      <tspan x="116" dy="17">
        devices, combining AI agents, ADB automation, application control, web navigation, and intelligent task execution.
      </tspan>
    </text>

    <text x="1017"
          y="409"
          class="status"
          text-anchor="end">
