<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="800"
     viewBox="0 0 1200 800"
     role="img"
     aria-labelledby="title desc">

  <title id="title">Animated Matrix Developer Profile</title>
  <desc id="desc">Matrix-inspired developer dashboard with animated digital rain, terminal, technology stack, and six project cards.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020b08"/>
      <stop offset=".55" stop-color="#061b12"/>
      <stop offset="1" stop-color="#020705"/>
    </linearGradient>

    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b12" stop-opacity=".98"/>
      <stop offset="1" stop-color="#020a07" stop-opacity=".99"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#20ff78"
            stroke-opacity=".075"/>
    </pattern>

    <clipPath id="screen">
      <rect width="1200" height="800" rx="18"/>
    </clipPath>

    <style>
      .mono {
        font-family: "Courier New", monospace;
      }

      .green {
        fill: #45ff89;
      }

      .white {
        fill: #d4ffe2;
      }

      .muted {
        fill: #83dca0;
      }

      .section {
        font-family: "Courier New", monospace;
        font-size: 14px;
        fill: #5aff96;
      }

      .panel {
        fill: url(#panel);
        stroke: #20ff75;
        stroke-opacity: .55;
      }

      .card {
        fill: #071b12;
        stroke: #27ff79;
        stroke-opacity: .6;
      }

      .blink {
        animation: blink 1s steps(2, start) infinite;
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }

      .float {
        animation: float 4s ease-in-out infinite;
      }

      .rain {
        fill: #36ff86;
        font-family: "Courier New", monospace;
        font-size: 14px;
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { opacity: .55; }
        50% { opacity: 1; }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
    </style>
  </defs>

  <g clip-path="url(#screen)">

    <!-- BACKGROUND -->
    <rect width="1200" height="800" fill="url(#bg)"/>
    <rect width="1200" height="800" fill="url(#grid)"/>

    <!-- MATRIX DIGITAL RAIN -->

    <g class="rain">

      <g opacity=".45">
        <text x="30" y="-120">0101
          <tspan x="30" dy="18">アイ</tspan>
          <tspan x="30" dy="18">1100</tspan>
          <tspan x="30" dy="18">0101</tspan>
          <tspan x="30" dy="18">∆01</tspan>
          <animate attributeName="y"
                   values="-120;820"
                   dur="8s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".28">
        <text x="130" y="-200">1010
          <tspan x="130" dy="18">0101</tspan>
          <tspan x="130" dy="18">0100</tspan>
          <tspan x="130" dy="18">0110</tspan>
          <tspan x="130" dy="18">1001</tspan>
          <animate attributeName="y"
                   values="-200;820"
                   dur="11s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".4">
        <text x="270" y="-80">0110
          <tspan x="270" dy="18">0101</tspan>
          <tspan x="270" dy="18">1101</tspan>
          <tspan x="270" dy="18">アイ</tspan>
          <tspan x="270" dy="18">0100</tspan>
          <animate attributeName="y"
                   values="-80;820"
                   dur="9s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".28">
        <text x="430" y="-240">1001
          <tspan x="430" dy="18">0010</tspan>
          <tspan x="430" dy="18">0101</tspan>
          <tspan x="430" dy="18">1100</tspan>
          <tspan x="430" dy="18">1010</tspan>
          <animate attributeName="y"
                   values="-240;820"
                   dur="12s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".36">
        <text x="600" y="-140">0101
          <tspan x="600" dy="18">1100</tspan>
          <tspan x="600" dy="18">0110</tspan>
          <tspan x="600" dy="18">0101</tspan>
          <tspan x="600" dy="18">1001</tspan>
          <animate attributeName="y"
                   values="-140;820"
                   dur="10s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".3">
        <text x="790" y="-300">1010
          <tspan x="790" dy="18">0101</tspan>
          <tspan x="790" dy="18">アイ</tspan>
          <tspan x="790" dy="18">0100</tspan>
          <tspan x="790" dy="18">1101</tspan>
          <animate attributeName="y"
                   values="-300;820"
                   dur="13s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".4">
        <text x="1010" y="-100">0101
          <tspan x="1010" dy="18">1100</tspan>
          <tspan x="1010" dy="18">0110</tspan>
          <tspan x="1010" dy="18">0101</tspan>
          <tspan x="1010" dy="18">1001</tspan>
          <animate attributeName="y"
                   values="-100;820"
                   dur="10s"
                   repeatCount="indefinite"/>
        </text>
      </g>

      <g opacity=".28">
        <text x="1140" y="-260">1010
          <tspan x="1140" dy="18">0101</tspan>
          <tspan x="1140" dy="18">アイ</tspan>
          <tspan x="1140" dy="18">0100</tspan>
          <tspan x="1140" dy="18">1101</tspan>
          <animate attributeName="y"
                   values="-260;820"
                   dur="14s"
                   repeatCount="indefinite"/>
        </text>
      </g>

    </g>

    <!-- OUTER FRAME -->

    <rect x="18" y="18"
          width="1164"
          height="764"
          rx="14"
          fill="none"
          stroke="#25ff78"
          stroke-opacity=".75"/>

    <path d="M18 68H1182"
          stroke="#2aff7e"
          stroke-opacity=".55"/>

    <!-- WINDOW CONTROLS -->

    <circle cx="40" cy="43" r="5" fill="#ff5c5c"/>
    <circle cx="58" cy="43" r="5" fill="#ffce54"/>
    <circle cx="76" cy="43" r="5" fill="#27ef78"/>

    <text x="96" y="48"
          class="mono"
          font-size="14"
          fill="#7affab">
      SYSTEM://PROFILE_ROOT
    </text>

    <text x="1150" y="48"
          text-anchor="end"
          class="mono"
          font-size="12"
          fill="#3eff84">
      [ ONLINE ]
    </text>

    <!-- TERMINAL -->

    <rect x="38" y="94"
          width="545"
          height="238"
          rx="9"
          class="panel"/>

    <text x="58" y="121" class="section">
      01 // TERMINAL_SESSION
    </text>

    <path d="M58 134H563"
          stroke="#25ff78"
          stroke-opacity=".35"/>

    <g class="mono" font-size="14">

      <text x="58" y="164" fill="#36ff80">
        user@matrix:~$
        <tspan fill="#d6ffe3"> whoami</tspan>
      </text>

      <text x="58" y="189" fill="#a0eeb8">
        Software developer building useful things.
      </text>

      <text x="58" y="222" fill="#36ff80">
        user@matrix:~$
        <tspan fill="#d6ffe3"> cat focus.txt</tspan>
      </text>

      <text x="58" y="247" fill="#a0eeb8">
