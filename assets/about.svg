    <g class="float">
      <rect x="806" y="385"
            width="356"
            height="108"
            rx="8"
            class="panel"/>

      <text x="824" y="414"
            class="mono white"
            font-size="16"
            font-weight="bold">
        &gt; Lesto Personal Assistant
      </text>

      <text x="824" y="437"
            class="mono muted"
            font-size="12">
