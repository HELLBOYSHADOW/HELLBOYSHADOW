      <rect x="935" y="163"
            width="82" height="27"
            rx="4"
            class="card"/>
      <text x="976" y="181" text-anchor="middle">JAVA</text>

      <rect x="1024" y="163"
            width="117" height="27"
            rx="4"
            class="card"/>
      <text x="1082" y="181" text-anchor="middle">HTML / CSS</text>

    </g>

    <!-- WEB DEVELOPMENT -->

    <text x="622" y="211"
          class="mono"
          font-size="10"
          fill="#45ff89">
      WEB DEVELOPMENT
    </text>

    <g class="mono" font-size="12" fill="#baffce">

      <rect x="622" y="219"
            width="82" height="27"
            rx="4"
            class="card"/>
      <text x="663" y="237" text-anchor="middle">REACT</text>

      <rect x="711" y="219"
            width="105" height="27"
            rx="4"
            class="card"/>
      <text x="763" y="237" text-anchor="middle">NEXT.JS</text>

      <rect x="823" y="219"
            width="105" height="27"
            rx="4"
            class="card"/>
      <text x="875" y="237" text-anchor="middle">NODE.JS</text>

      <rect x="935" y="219"
            width="82" height="27"
            rx="4"
            class="card"/>
      <text x="976" y="237" text-anchor="middle">EXPRESS</text>

      <rect x="1024" y="219"
            width="117" height="27"
            rx="4"
            class="card"/>
      <text x="1082" y="237" text-anchor="middle">REST APIs</text>

    </g>

    <!-- AI AND INFRASTRUCTURE -->

    <text x="622" y="267"
          class="mono"
          font-size="10"
          fill="#45ff89">
      AI / TOOLS / INFRASTRUCTURE
    </text>

    <g class="mono" font-size="11" fill="#baffce">

      <rect x="622" y="275"
            width="82" height="27"
            rx="4"
            class="card"/>
      <text x="663" y="293" text-anchor="middle">LLMs</text>

      <rect x="711" y="275"
            width="105" height="27"
            rx="4"
            class="card"/>
      <text x="763" y="293" text-anchor="middle">GEN AI</text>

      <rect x="823" y="275"
            width="105" height="27"
            rx="4"
            class="card"/>
      <text x="875" y="293" text-anchor="middle">RAG / MCP</text>

      <rect x="935" y="275"
            width="82" height="27"
            rx="4"
            class="card"/>
      <text x="976" y="293" text-anchor="middle">GIT</text>

      <rect x="1024" y="275"
            width="117" height="27"
            rx="4"
            class="card"/>
      <text x="1082" y="293" text-anchor="middle">DOCKER</text>

    </g>

    <text x="622" y="320"
          class="mono"
          font-size="10"
          fill="#67d994">
      SQL · FIREBASE · PYTORCH · OLLAMA · CUDA
    </text>

    <!-- PROJECT SECTION -->

    <text x="40" y="367" class="section">
      03 // ACTIVE_PROJECTS
    </text>

    <path d="M225 362H1160"
          stroke="#25ff78"
          stroke-opacity=".35"/>

    <!-- PROJECT 1: LEARNIFY AI -->

    <g class="float">
      <rect x="38" y="385"
            width="356"
            height="108"
            rx="8"
            class="panel"/>

      <text x="56" y="414"
            class="mono white"
            font-size="17"
            font-weight="bold">
        &gt; Learnify AI
      </text>

      <text x="56" y="437"
            class="mono muted"
            font-size="12">
        AI-powered learning companion
      </text>

      <text x="56" y="469"
            class="mono green"
            font-size="11">
        [ AI ] [ LEARNING ] [ APP ]
      </text>

      <circle cx="373" cy="405" r="4"
              fill="#39ff85"
              class="pulse"/>
    </g>

    <!-- PROJECT 2: WHATSAPP AI BOT -->

    <g>
      <rect x="422" y="385"
            width="356"
            height="108"
            rx="8"
            class="panel"/>

      <text x="440" y="414"
            class="mono white"
            font-size="17"
            font-weight="bold">
        &gt; WhatsApp AI Bot
      </text>

      <text x="440" y="437"
            class="mono muted"
            font-size="12">
